name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: >-
          netracer-metrics pair
          examples/synthetic/gold.swc
          examples/synthetic/test_jump.swc
      - name: Batch smoke test
        run: >-
          netracer-metrics batch
          examples/road_crop/manifest.csv
          --output-dir example-results
